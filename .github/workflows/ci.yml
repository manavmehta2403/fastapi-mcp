name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-asyncio pytest-cov pylint httpx

      - name: Run Pytest Test Suite with Coverage (>=95%)
        run: |
          pytest tests/ -v --cov=fastapi_mcp --cov-report=term-missing --cov-fail-under=95

      - name: Run Pylint Quality Gate (>=9.5/10)
        run: |
          pylint fastapi_mcp --fail-under=9.5
