[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-fastmcp"
version = "0.10.0"
description = "The unified bridge between FastAPI and FastMCP / Model Context Protocol."
readme = "README.md"
authors = [{ name = "Manav Mehta" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["fastapi", "mcp", "fastmcp", "model-context-protocol", "ai", "agents", "llm", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pylint>=3.0.0",
]

[tool.poetry]
packages = [{ include = "fastapi_mcp" }]

[project.scripts]
fastapi-mcp = "fastapi_mcp.cli:main"
fastapi-fastmcp = "fastapi_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/manavmehta2403/fastapi-mcp"
Repository = "https://github.com/manavmehta2403/fastapi-mcp"
Issues = "https://github.com/manavmehta2403/fastapi-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapi_mcp*"]

[tool.pylint.main]
max-line-length = 100

[tool.pylint.design]
max-args = 15
max-attributes = 15
max-locals = 25
max-statements = 60
max-public-methods = 35

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
]
